name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer kivy-ios

      - name: Install System Dependencies
        run: |
          brew install automake libtool pkg-config libffi

      - name: Build Xcode Project with Buildozer
        run: |
          # Собираем только проект Xcode без финальной упаковки buildozer'ом
          buildozer ios debug
        continue-on-error: true

      - name: Compile IPA via Xcode CLI
        run: |
          # Ищем сгенерированный проект xcode и собираем .ipa напрямую через xcodebuild
          cd .buildozer/ios/platform/kivy-ios/
          cd *-ios
          xcodebuild -project *.xcodeproj -scheme * -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          
          # Упаковываем скомпилированное приложение .app в архив .ipa
          mkdir -p Payload
          cp -r build/Debug-iphoneos/*.app Payload/
          zip -r ../../../../FuckPhone.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuckPhone-iOS-IPA
          path: FuckPhone.ipa
